[project]
name = "cpp-ml-portfolio-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "onnx>=1.16,<2",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.20,<1",
    "torch>=2.5,<3",
    "pillow>=10,<13",
    "requests>=2.32,<3",
    "scikit-learn>=1.6,<2",
    "torchvision>=0.20,<1",
    "onnxscript>=0.2,<1",
    "clang-format>=18,<23",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "opencv-python-headless>=4.12,<5",
]

[project.optional-dependencies]
tracking = ["mlflow>=3,<4"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cpu", marker = "sys_platform == 'linux'"}]
torchvision = [{index = "pytorch-cpu", marker = "sys_platform == 'linux'"}]
